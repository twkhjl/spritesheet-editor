<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spritesheet Editor</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><strong>SPRITESHEET <b>EDITOR</b></strong><span>圖片只留在瀏覽器</span></header>
<main>
<aside>
<h1>載入並對齊每一格</h1>
<label class="drop">選擇或拖放 spritesheet<input id="file" type="file" accept="image/png,image/jpeg,image/webp"><small id="filename">尚未選擇</small></label>
<div class="grid3"><label>欄數<input id="columns" type="number" min="1" value="5"></label><label>列數<input id="rows" type="number" min="1" value="5"></label><label>FPS<input id="fps" type="number" min="1" max="60" value="12"></label></div>
<label class="check"><input id="loop" type="checkbox" checked>循環播放</label>
<section><h2>影格位置</h2><div class="grid2"><label>X 位移<input id="offsetX" type="number" step="1" value="0"></label><label>Y 位移<input id="offsetY" type="number" step="1" value="0"></label></div>
<div class="nudge"><button data-move="0,-1">↑</button><button data-move="-1,0">←</button><button id="reset">重設</button><button data-move="1,0">→</button><button data-move="0,1">↓</button></div>
<div class="actions"><button id="copyPrev">複製上一格</button><button id="copyNext">複製下一格</button><button id="applyAll">套用至全部</button><button id="undo">Undo</button><button id="redo">Redo</button></div></section>
<section><h2>匯出</h2><div class="actions"><button id="png">PNG</button><button id="webp">WebP</button><button id="json">設定 JSON</button><label class="button">匯入 JSON<input id="project" type="file" accept="application/json,.json"></label></div></section>
<p id="message">載入圖片後即可編輯。</p>
</aside>
<article>
<div class="readout"><span id="current">格子 1</span><strong id="counter">01 / 25</strong></div>
<nav><button data-view="animation" class="active">動畫</button><button data-view="editor">單格編輯</button><button data-view="sheet">完整圖表</button></nav>
<div class="stage"><div id="empty">等待 spritesheet</div><canvas id="animation" hidden></canvas><canvas id="editor" hidden></canvas><div id="sheetView" hidden><div id="sheetWrap"><img id="sheet"><div id="picker"></div></div></div></div>
<div class="transport"><button id="prev">←</button><button id="play">▶ 播放</button><button id="next">→</button><label>縮放<input id="zoom" type="range" min="50" max="200" value="100"><output id="zoomOut">100%</output></label></div>
<section><div class="sequenceHead"><h2>播放順序</h2><span><button id="all">使用全部</button><button id="clear">清空</button></span></div><ol id="sequence"></ol></section>
</article></main><script type="module" src="/app.js"></script></body></html>
